[project]
name = "cire"
version = "1.1.2"
authors = [
    {name="Ben McFarlin", email="ben@qeala.com"}
]
description = "Dashscope modules for Pipecat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope==1.25.13",
    "loguru>=0.7.3",
    "pipecat-ai==0.0.101",
    "python-dotenv==1.2.1",
]
classifiers = [
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/bmcfarlin/cire"
Issues = "https://github.com/bmcfarlin/cire/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cire"]

